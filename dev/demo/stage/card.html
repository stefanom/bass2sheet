<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>card</title>
<link rel="stylesheet" href="stage.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  #card { width: 1240px; }
  h1 { margin: 0; font-size: 84px; line-height: 1.05; font-weight: 700; letter-spacing: -.02em; }
  h1 small { font-size: 84px; font-weight: 400; color: var(--soft); }
  h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  p.lead { margin: 18px 0 0; font-size: 30px; line-height: 1.3; color: var(--soft); max-width: 900px; }
  .rule { width: 72px; height: 5px; border-radius: 3px; background: var(--blue); margin: 0 0 30px; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px 30px; }
  .steps { display: flex; flex-direction: column; gap: 16px; margin: 0 0 24px; }
  .step { display: flex; align-items: center; gap: 18px; }
  .step i { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff; font: 700 20px/40px -apple-system, Helvetica, Arial, sans-serif; text-align: center; font-style: normal; }
  .step code { font: 600 30px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .step span { font-size: 23px; color: var(--soft); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .box p { margin: 0 0 5px; font-size: 22px; line-height: 1.4; }
  .box p.soft { font-size: 19px; }
  .foot { margin-top: 20px; font-size: 15px; color: var(--soft); }
</style>
</head>
<body>
<div id="card"></div>
<script>
// show({kind: "title", ...}) or show({kind: "get", ...}): called by the film with the words to show
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function show(c) {
  const el = document.getElementById("card");
  if (c.kind === "title") {
    el.innerHTML = `<div class="rule"></div><h1>${esc(c.title)}</h1><p class="lead">${esc(c.lead)}</p>`;
  } else {
    el.innerHTML = `<h2>${esc(c.heading)}</h2>
      <div class="box steps">${c.steps.map((s, k) => `<div class="step"><i>${k + 1}</i><code>${esc(s[0])}</code><span>${esc(s[1])}</span></div>`).join("")}</div>
      <div class="cols">${c.boxes.map(b => `<div class="box"><h2>${esc(b.heading)}</h2>${b.lines.map((l, k) => `<p${k ? ' class="soft"' : ""}>${esc(l)}</p>`).join("")}</div>`).join("")}</div>
      <div class="foot">${esc(c.foot || "")}</div>`;
  }
  return true;
}
</script>
</body>
</html>
