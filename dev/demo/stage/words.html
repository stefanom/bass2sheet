<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>words</title>
<link rel="stylesheet" href="stage.css">
<style>
  /* Words laid over the film, drawn here once and kept as pictures with nothing behind them: the narration's
     lines in the band under the picture, and the small signs in the picture's corners ("13x faster"). The page
     is the film's size: the picture is its upper 945 lines, the band the 135 under it. */
  html, body { background: transparent; }
  #caption { position: absolute; left: 0; right: 0; top: 945px; height: 135px; display: flex; align-items: center; justify-content: center; }
  #caption div { max-width: 1820px; padding: 0 20px 4px; color: #fff; font-size: 42px; line-height: 1.2; font-weight: 500; text-align: center; text-wrap: balance; }
  #sign { position: absolute; right: 36px; top: 30px; padding: 8px 20px; border-radius: 22px; background: rgba(31, 35, 40, .88); color: #fff; font-size: 28px; font-weight: 600; }
  #sign.left { right: auto; left: 36px; }
  #sign b { color: #ffc400; margin-right: 8px; }
</style>
</head>
<body>
<div id="caption" class="hidden"><div></div></div>
<div id="sign" class="hidden"></div>
<script>
function caption(text) { document.getElementById("sign").classList.add("hidden"); const c = document.getElementById("caption"); c.classList.remove("hidden"); c.firstChild.textContent = text; return true; }
function sign(html, left) { document.getElementById("caption").classList.add("hidden"); const s = document.getElementById("sign"); s.classList.remove("hidden"); s.classList.toggle("left", !!left); s.innerHTML = html; return true; }
</script>
</body>
</html>
