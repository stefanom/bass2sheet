<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>phone</title>
<link rel="stylesheet" href="stage.css">
<style>
  body { display: flex; align-items: center; justify-content: center; background: var(--desk); }
  /* a phone held sideways: 844 x 390 of its own pixels, drawn larger so that it fills the picture */
  #phone { position: relative; width: calc(844px * var(--k) + 36px); height: calc(390px * var(--k) + 36px); border-radius: 46px; background: #1f2328; box-shadow: 0 14px 50px rgba(31, 35, 40, .4), inset 0 0 0 2px #454c54; }
  #screen { position: absolute; left: 18px; top: 18px; width: calc(844px * var(--k)); height: calc(390px * var(--k)); border-radius: 30px; overflow: hidden; background: #000; }
  iframe { width: 844px; height: 390px; border: 0; transform: scale(var(--k)); transform-origin: 0 0; background: #1f2328; }
</style>
</head>
<body style="--k: 1.55">
<div id="phone"><div id="screen"><iframe id="page" title="The page on the phone" allow="autoplay"></iframe></div></div>
<script>
function show(url) { document.getElementById("page").src = url; return true; }
</script>
</body>
</html>
