[project]
name = "bass2sheet"
version = "0.1.0"
description = "Song audio file -> printable bass sheet (PDF, MusicXML, MIDI) with quality gates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "av",
  "pretty_midi",
  "mir_eval",
  "torch",
  "torchcrepe",
  "demucs",
  "audio-separator[cpu]",
  "audioread",
  "imageio-ffmpeg",
  "setuptools<81",
  "pyyaml",
]

[project.scripts]
bass2sheet = "bass2sheet.cli:main"
bass2sheet-eval = "bass2sheet.evaluate:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full: needs the separation models (and optionally an evaluation dataset); enable with BASS2SHEET_FULL_E2E=1"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E741", "B905"]  # small lambdas, short math names, zip() over unequal lengths: all on purpose

[tool.ruff.lint.per-file-ignores]
"src/bass2sheet/report.py" = ["E501"]  # the HTML template
"dev/*" = ["E402", "E501", "B023"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bass2sheet"]
