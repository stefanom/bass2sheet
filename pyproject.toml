[project]
name = "bass2sheet"
version = "0.1.0"
description = "Song audio file -> printable bass sheet (PDF, MusicXML, MIDI) with quality gates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "av",
  "pretty_midi",
  "mir_eval",
  "torch",
  "torchcrepe",
  "demucs",
  "audio-separator[cpu]",
  "audioread",
  "imageio-ffmpeg",
  "setuptools<81",
  "pyyaml",
]

[project.scripts]
bass2sheet = "bass2sheet.cli:main"
bass2sheet-eval = "bass2sheet.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bass2sheet"]
